<svg width="760" height="640" viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="760" height="640" rx="8" fill="#3c3c3c"/>
  <rect width="760" height="34" rx="8" fill="#3c3c3c"/>
  <text x="380" y="22" fill="#cccccc" font-size="13" text-anchor="middle">新增条目 — Webview 表单</text>

  <rect y="34" width="760" height="606" fill="#1e1e1e"/>

  <text x="48" y="84" fill="#e6e6e6" font-size="20" font-weight="bold">新增条目</text>
  <text x="48" y="108" fill="#858585" font-size="13">填写后点击「保存」，数据将写入当前工作区的存储。</text>
  <line x1="48" y1="124" x2="712" y2="124" stroke="#3c3c3c"/>

  <text x="48" y="156" fill="#e6e6e6" font-size="13" font-weight="bold">名称 <tspan fill="#f48771">*</tspan></text>
  <rect x="48" y="166" width="664" height="28" rx="2" fill="#3c3c3c" stroke="#0098ff"/>
  <text x="58" y="185" fill="#e6e6e6" font-size="13">对接第三方登录</text>

  <text x="48" y="222" fill="#e6e6e6" font-size="13" font-weight="bold">分类</text>
  <rect x="48" y="232" width="664" height="28" rx="2" fill="#3c3c3c" stroke="#414141"/>
  <text x="58" y="251" fill="#e6e6e6" font-size="13">需求</text>

  <text x="48" y="288" fill="#e6e6e6" font-size="13" font-weight="bold">优先级</text>
  <rect x="48" y="298" width="664" height="28" rx="2" fill="#3c3c3c" stroke="#414141"/>
  <text x="58" y="317" fill="#e6e6e6" font-size="13">高</text>
  <text x="700" y="317" fill="#858585" font-size="12">▾</text>

  <text x="48" y="354" fill="#e6e6e6" font-size="13" font-weight="bold">标签</text>
  <rect x="48" y="364" width="664" height="28" rx="2" fill="#3c3c3c" stroke="#414141"/>
  <text x="58" y="383" fill="#e6e6e6" font-size="13">登录, 后端</text>
  <text x="48" y="404" fill="#858585" font-size="12">多个标签用逗号分隔</text>

  <text x="48" y="436" fill="#e6e6e6" font-size="13" font-weight="bold">描述</text>
  <rect x="48" y="446" width="664" height="76" rx="2" fill="#3c3c3c" stroke="#414141"/>
  <text x="58" y="468" fill="#e6e6e6" font-size="13">支持手机号 + 验证码登录，预留 OAuth 扩展点，</text>
  <text x="58" y="488" fill="#e6e6e6" font-size="13">预计 3 天完成，联调依赖网关环境。</text>

  <rect x="546" y="546" width="76" height="30" rx="2" fill="#3a3d41" stroke="#414141"/>
  <text x="584" y="566" fill="#cccccc" font-size="13" text-anchor="middle">取消</text>
  <rect x="636" y="546" width="76" height="30" rx="2" fill="#0e639c"/>
  <text x="674" y="566" fill="#ffffff" font-size="13" text-anchor="middle">保存</text>

  <text x="48" y="566" fill="#858585" font-size="12"><tspan fill="#858585">Esc</tspan> 取消 · <tspan fill="#858585">Ctrl+Enter</tspan> 保存（提示芯片随主题配色）</text>

  <text x="48" y="608" fill="#569cd6" font-size="12">✔ 校验：名称必填（出错红框 + 行内提示，输入即清除）；表单由 formSchema.ts 驱动，加字段零改界面代码</text>
</svg>
