<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="900" height="560" rx="8" fill="#3c3c3c"/>
  <rect width="900" height="34" rx="8" fill="#3c3c3c"/>
  <text x="450" y="22" fill="#cccccc" font-size="13" text-anchor="middle">vscode-starter-template — 调试（扩展开发宿主）</text>

  <rect y="34" width="900" height="490" fill="#1e1e1e"/>

  <rect x="290" y="46" width="320" height="30" rx="4" fill="#333333" stroke="#414141"/>
  <g font-size="14" text-anchor="middle">
    <text x="315" y="66" fill="#c5c5c5">▶︎⏸</text>
    <text x="355" y="66" fill="#c5c5c5">⤶</text>
    <text x="395" y="66" fill="#c5c5c5">⟳</text>
    <text x="435" y="66" fill="#c5c5c5">■</text>
    <text x="480" y="66" fill="#cccccc" font-size="12">调试插件（F5 运行）</text>
    <text x="585" y="66" fill="#cccccc" font-size="12">⌘</text>
  </g>

  <rect x="60" y="110" width="780" height="96" rx="6" fill="#094771" stroke="#0098ff"/>
  <text x="450" y="140" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">按 F5 启动调试</text>
  <text x="450" y="166" fill="#c5c5c5" font-size="13" text-anchor="middle">运行 → 启动调试（F5）｜首次会自动执行 npm: compile 任务并弹出「扩展开发宿主」窗口</text>
  <path d="M 450 96 L 450 110" stroke="#0098ff" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0098ff"/>
    </marker>
  </defs>

  <g font-family="Consolas, monospace" font-size="13">
    <text x="80" y="240" fill="#6a9955">// src/extension.ts —— 在 activate() 第一行打断点，可观察插件激活流程</text>
    <text x="80" y="266" fill="#c586c0">export function</text>
    <text x="182" y="266" fill="#dcdcaa">activate</text>
    <text x="238" y="266" fill="#d4d4d4">(context: vscode.ExtensionContext): </text><text x="452" y="266" fill="#569cd6">void</text><text x="482" y="266" fill="#d4d4d4"> {</text>
    <rect x="72" y="278" width="756" height="22" fill="#264f78"/>
    <text x="80" y="294" fill="#e6e6e6">  debugger;  ← 断点命中时整行高亮，可查看 context / 变量 / 调用栈</text>
    <text x="80" y="320" fill="#d4d4d4">  </text><text x="96" y="320" fill="#c586c0">const</text><text x="136" y="320" fill="#4ec9b0"> store</text><text x="182" y="320" fill="#d4d4d4"> = </text><text x="196" y="320" fill="#dcdcaa">createStore</text><text x="266" y="320" fill="#d4d4d4">(context);</text>
    <text x="80" y="346" fill="#d4d4d4">  </text><text x="96" y="346" fill="#858585">…组装服务 / 视图 / 命令 / 启动任务</text>
    <text x="80" y="372" fill="#d4d4d4">}</text>
  </g>

  <rect x="60" y="420" width="780" height="86" rx="6" fill="#252526" stroke="#414141"/>
  <text x="80" y="446" fill="#dcdcaa" font-size="13" font-weight="bold">调试控制台 / 终端面板</text>
  <text x="80" y="468" fill="#858585" font-size="12">Terminal ｜ Debug Console ｜ 输出（选择「CRUD Starter」可看启动任务与编译日志）</text>
  <text x="80" y="490" fill="#23d18b" font-size="12">[扩展宿主] 扩展已激活：vscode-starter-template@0.6.1</text>

  <rect y="526" width="900" height="34" fill="#007acc"/>
  <text x="16" y="548" fill="#ffffff" font-size="12">⎇ main</text>
  <text x="740" y="548" fill="#ffffff" font-size="12">◉ 扩展开发宿主已连接 — 断点 1</text>
</svg>
