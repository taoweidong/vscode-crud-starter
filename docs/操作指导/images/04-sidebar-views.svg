<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="900" height="560" rx="8" fill="#3c3c3c"/>
  <rect width="900" height="34" rx="8" fill="#3c3c3c"/>
  <text x="450" y="22" fill="#cccccc" font-size="13" text-anchor="middle">扩展开发宿主 — CRUD Starter 侧边栏（6 个视图）</text>

  <rect y="34" width="52" height="526" fill="#333333"/>
  <rect x="10" y="60" width="32" height="32" rx="4" fill="#094771" stroke="#0098ff"/>
  <g stroke="#75beff" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="17" y="67" width="18" height="18" rx="2.5"/>
    <line x1="21" y1="73" x2="31" y2="73"/>
    <line x1="21" y1="76.5" x2="31" y2="76.5"/>
    <line x1="21" y1="80" x2="28" y2="80"/>
  </g>
  <rect x="20" y="490" width="12" height="12" fill="#858585"/>
  <circle cx="26" cy="530" r="10" fill="#414141"/>

  <rect x="52" y="34" width="268" height="526" fill="#252526"/>

  <g>
    <rect x="52" y="34" width="268" height="22" fill="#37373d"/>
    <text x="64" y="50" fill="#e7e7e7" font-size="11" font-weight="bold">条目列表</text>
    <text x="230" y="50" fill="#cccccc" font-size="12">＋</text>
    <text x="252" y="50" fill="#cccccc" font-size="11">🔍</text>
    <text x="274" y="50" fill="#cccccc" font-size="11">↻</text>
    <g font-size="12">
      <text x="70" y="76" fill="#c5c5c5">▼ 📁 工作</text>
      <text x="96" y="98" fill="#e6e6e6">↑ 任务A</text>
      <text x="180" y="98" fill="#858585">前端 · 待办</text>
      <text x="96" y="120" fill="#e6e6e6">— 任务B</text>
      <text x="180" y="120" fill="#858585">review</text>
      <text x="70" y="142" fill="#c5c5c5">▼ 📁 生活</text>
      <text x="96" y="164" fill="#e6e6e6">↓ 购物清单</text>
      <text x="96" y="188" fill="#858585">单击条目 = 打开编辑表单</text>
    </g>
  </g>

  <g>
    <rect x="52" y="204" width="268" height="22" fill="#252526"/>
    <text x="64" y="220" fill="#bbbbbb" font-size="11" font-weight="bold">环境信息</text>
    <text x="274" y="220" fill="#cccccc" font-size="11">↻ 📄</text>
    <text x="70" y="242" fill="#858585" font-size="11">▸ 环境检测 · 正常 · 447ms</text>
  </g>

  <g>
    <text x="64" y="270" fill="#bbbbbb" font-size="11" font-weight="bold">环境初始化</text>
    <text x="274" y="270" fill="#cccccc" font-size="11">☑</text>
    <text x="70" y="292" fill="#858585" font-size="11">▸ 5 个步骤 · 单击执行</text>
  </g>

  <g>
    <text x="64" y="320" fill="#bbbbbb" font-size="11" font-weight="bold">特性配置</text>
    <text x="274" y="320" fill="#cccccc" font-size="11">⚙</text>
    <text x="70" y="342" fill="#858585" font-size="11">▸ 5 个开关 · 单击切换</text>
  </g>

  <g>
    <text x="64" y="370" fill="#bbbbbb" font-size="11" font-weight="bold">静态配置</text>
    <text x="274" y="370" fill="#cccccc" font-size="11">📄</text>
    <text x="70" y="392" fill="#858585" font-size="11">▸ 只读展示 · 修改自动刷新</text>
  </g>

  <g>
    <text x="64" y="420" fill="#bbbbbb" font-size="11" font-weight="bold">分支编译</text>
    <text x="274" y="420" fill="#cccccc" font-size="11">📦</text>
    <text x="70" y="442" fill="#858585" font-size="11">▸ main · 单击分支编译出包</text>
  </g>

  <rect x="340" y="34" width="560" height="492" fill="#1e1e1e"/>
  <text x="620" y="120" fill="#dcdcaa" font-size="16" text-anchor="middle" font-weight="bold">六个视图一览</text>
  <g font-size="13" fill="#cccccc">
    <text x="400" y="170">① 条目列表 —— 树视图 CRUD（查/增/改/删/克隆/过滤）</text>
    <text x="400" y="204">② 环境信息 —— 激活时自动检测 Python / Node / Git 等</text>
    <text x="400" y="238">③ 环境初始化 —— 步骤清单，单击执行单步或全部</text>
    <text x="400" y="272">④ 特性配置 —— 开关真实影响插件行为</text>
    <text x="400" y="306">⑤ 静态配置 —— 只读展示 + 文件联动</text>
    <text x="400" y="340">⑥ 分支编译 —— 选分支一键编译出 .vsix</text>
  </g>
  <rect x="380" y="372" width="480" height="118" rx="6" fill="#252526" stroke="#414141"/>
  <text x="396" y="398" fill="#dcdcaa" font-size="12" font-weight="bold">💡 建议的体验顺序</text>
  <text x="396" y="420" fill="#cccccc" font-size="12">先点 ③ 环境初始化 → 全部初始化（生成数据与配置），</text>
  <text x="396" y="440" fill="#cccccc" font-size="12">再回 ① 条目列表玩增删改查，最后看 ② 环境信息、⑥ 分支编译。</text>
  <text x="396" y="466" fill="#858585" font-size="12">视图标题栏的按钮随视图切换（门禁已校验 when 条件）。</text>

  <rect y="526" width="900" height="34" fill="#007acc"/>
  <text x="16" y="548" fill="#ffffff" font-size="12">⎇ main</text>
  <text x="780" y="548" fill="#ffffff" font-size="12">扩展开发宿主</text>
</svg>
